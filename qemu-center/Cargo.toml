[package]
name = "qemu-center"
version = "0.1.0"
edition = "2021"
description = "Standalone QEMU/WHPX track for Redroid Device Center: one VM = one node hosting N redroid containers"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"

[dev-dependencies]
# Intentionally empty: zero-external-dep red line. All tests are std-only
# pure-function tests (serde/serde_json/clap/dirs are runtime deps, not dev).

[lib]
name = "qemu_center"
path = "src/lib.rs"

[[bin]]
name = "qemu-center"
path = "src/main.rs"
