# Redroid Device Center 默认设备伪装 profile（红队对抗测试用）
# 格式：
#   set|<prop>|<value>    设置属性（ro.product.* / ro.build.fingerprint / ro.build.description
#                          会自动展开到 vendor/system/product/system_ext/odm 分区级变体）
#   del|<prop>            删除属性
# 复制本文件修改后，在「Docker → 创建实例」里通过「伪装配置文件」指定，或直接替换此默认文件重建镜像。

# ===== 机型身份（示例：Redmi K40 / alioth，按目标场景自行更换） =====
set|ro.product.brand|Xiaomi
set|ro.product.manufacturer|Xiaomi
set|ro.product.model|2210132C
set|ro.product.device|alioth
set|ro.product.name|alioth
set|ro.product.marketname|Redmi K40

set|ro.build.fingerprint|Xiaomi/alioth/alioth:13/TKQ1.220829.002/V14.0.6.0.TKHCNXM:user/release-keys
set|ro.build.description|alioth-user 13 TKQ1.220829.002 V14.0.6.0.TKHCNXM release-keys
set|ro.build.display.id|V14.0.6.0.TKHCNXM
set|ro.build.version.incremental|V14.0.6.0.TKHCNXM
set|ro.build.tags|release-keys
set|ro.build.type|user
set|ro.build.flavor|alioth-user
set|ro.build.version.release|13
set|ro.build.version.security_patch|2023-11-01

# ===== 反模拟器关键 props =====
del|ro.kernel.qemu
del|ro.boot.qemu
set|ro.bootmode|unknown
set|ro.boot.mode|unknown
set|ro.boot.bootreason|reboot
# 以下按需开启（x86_64 镜像伪装 qcom 硬件可能引起个别服务异常，默认注释）
