plugins {
    id "com.android.application"
}

android {
    namespace "dev.rdc.devicecloak"
    compileSdk 34

    defaultConfig {
        applicationId "dev.rdc.devicecloak"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 经典 Xposed API（compileOnly：不打包进 APK，运行时由 LSPosed 提供）。
    compileOnly "de.robv.android.xposed:api:82"
}
