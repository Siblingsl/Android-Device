name: macOS package

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]

    env:
      RDC_UPDATE_ENDPOINT: ${{ secrets.RDC_UPDATE_ENDPOINT }}
      RDC_UPDATE_PUBKEY: ${{ secrets.RDC_UPDATE_PUBKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-13' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Install macOS build tools
        run: brew install scrcpy android-platform-tools ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed macOS bundle
        run: npm run tauri:build:release -- --target ${{ matrix.os == 'macos-13' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: redroid-device-center-${{ matrix.os }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
