[package]
name = "redroid-device-center"
version = "0.1.0"
description = "Redroid Device Center - Android device management platform"
authors = ["Redroid Device Center"]
edition = "2021"
default-run = "redroid-device-center"

[lib]
name = "redroid_device_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-updater = "2.11.0"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1"
portable-pty = "0.9"
dirs = "6"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
rand_core = { version = "0.6.4", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdsa"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate", "xz"] }
rusqlite = { version = "0.32", features = ["bundled"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
